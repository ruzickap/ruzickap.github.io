---
name: generate-projects

on:
  workflow_dispatch:
  schedule:
    - cron: "3 3 * * 3"

permissions: read-all

jobs:
  generate-projects:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install rumdl
        uses: rvben/rumdl@dac508e6b2f52c1d869811d138ffc1ff2b9f6e71 # v0.3.3
        with:
          install-only: true
          # renovate: datasource=github-releases depName=rvben/rumdl
          version: 0.3.3

      - name: Generate _tabs/projects.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/generate-projects.sh _tabs/projects.md

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          add-paths: _tabs/projects.md
          branch: chore/generate-projects
          commit-message: "docs: update _tabs/projects.md"
          delete-branch: true
          labels: generate-projects
          title: "docs: update _tabs/projects.md"
